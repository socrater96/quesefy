spring:
  application:
    name: quesefy
  datasource:
    url: ${QUESEFY_POSTGRES_URL:jdbc:postgresql://localhost:5432/quesefy}
    driver-class-name: org.postgresql.Driver
    username: ${QUESEFY_POSTGRES_USERNAME:quesefy}
    password: ${QUESEFY_POSTGRES_PASSWORD:quesefy}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
