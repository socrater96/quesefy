services:
  postgres:
    image: postgres:16
    container_name: quesefy-postgres
    environment:
      POSTGRES_DB: quesefy
      POSTGRES_USER: quesefy
      POSTGRES_PASSWORD: quesefy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quesefy -d quesefy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
    name: quesefy_postgres_data
